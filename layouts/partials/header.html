<div id="masthead" class="masthead">
  <nav class="masthead-nav wrapper">
    <a class="site-title" href="{{ "/" | absURL }}">{{ .Site.Title }}</a>
    <ul class="site-nav">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL | absURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</div>
