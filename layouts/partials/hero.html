{{ $p := .Params }}
<div class="page__hero">
  <div class="wrapper">
    {{ with .Site.Params.author.avatar }}<img class="hero-avatar" src="{{ . | absURL }}" alt="{{ $.Site.Params.author.name }}">{{ end }}
    <h1 id="page-title" class="page__title">{{ .Title | markdownify }}</h1>
    {{ with .Params.excerpt }}<p class="page__lead">{{ . }}</p>{{ end }}
  </div>
</div>
